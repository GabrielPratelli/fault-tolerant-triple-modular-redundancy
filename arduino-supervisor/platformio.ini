; ============================================================================
;  ARDUINO SUPERVISOR — channel C (2-of-3 voting, AVR board)
;  Source: src/main.cpp  (hardware UART on pins 0/1, AVR watchdog)
; ============================================================================

[platformio]
default_envs = uno

; --- Arduino Uno (bootloader optiboot, upload @115200) ---
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; --- Arduino Nano ATmega328P with NEW bootloader (optiboot, >= 2018) ---
; To use it: set default_envs = nano_new
; [env:nano_new]
; platform = atmelavr
; board = nanoatmega328new
; framework = arduino
; monitor_speed = 115200

; --- Arduino Nano ATmega328P with OLD bootloader (< 2018, upload @57600) ---
; To use it: set default_envs = nano_old
; [env:nano_old]
; platform = atmelavr
; board = nanoatmega328
; framework = arduino
; monitor_speed = 115200
