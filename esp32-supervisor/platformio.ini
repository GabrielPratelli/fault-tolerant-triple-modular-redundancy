; ============================================================================
;  ESP32 SUPERVISOR — channels A + B (N-version diversity, FreeRTOS)
;  Source: src/main.c  (app_main, UART1 on pins 17/16, TWDT, TMR)
; ============================================================================
;  IMPORTANT: framework = espidf.
;  The code uses app_main(), FreeRTOS and driver/uart.h:
;  it does NOT build with framework = arduino (link error on app_main).
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; --- Upload fix: the esptool stub loses communication at 460800 baud ---
; --- ("No serial data received"). 115200 is reliable everywhere. ---
upload_speed = 115200

; --- This board has a 2MB flash, not 4MB (detected by the build). ---
; --- Avoids the warning and generates the right partition table. ---
board_upload.flash_size = 2MB
